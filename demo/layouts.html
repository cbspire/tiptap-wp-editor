<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TipTap Editor — Layouts demo</title>
<link rel="stylesheet" href="../assets/css/editor.css">
<link rel="stylesheet" href="../assets/css/editor-legacy.css">
<link rel="stylesheet" href="../assets/css/frontend.css">
<style>
body { margin:0; padding:32px; background:#f0f0f1; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
.demo-wrap { max-width:880px; margin:0 auto; }
.demo-title { width:100%; box-sizing:border-box; margin-bottom:16px; padding:8px 12px; border:1px solid #c3c4c7; border-radius:4px; font-size:1.5em; background:#fff; }
</style>
</head>
<body>
<div class="demo-wrap">
<input type="text" class="demo-title" value="Layouts, images & buttons">
<div id="tiptap-editor-root" data-post-id="1" data-content="&quot;&lt;h2&gt;Layouts &amp;amp; rich blocks&lt;/h2&gt;&lt;p&gt;Insert responsive columns, call-to-action buttons and styled images from the &lt;strong&gt;/&lt;/strong&gt; menu.&lt;/p&gt;&lt;div class=\&quot;tt-columns tt-columns--2\&quot;&gt;&lt;div class=\&quot;tt-column\&quot;&gt;&lt;h3&gt;Two columns&lt;/h3&gt;&lt;p&gt;Each column holds its own blocks and collapses to a single column on mobile.&lt;/p&gt;&lt;/div&gt;&lt;div class=\&quot;tt-column\&quot;&gt;&lt;img src=\&quot;sample-image.png\&quot; class=\&quot;tt-image tt-image--rounded tt-image--w100 wp-image-7 aligncenter\&quot; data-attachment-id=\&quot;7\&quot; alt=\&quot;Demo\&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\&quot;tt-button-wrap\&quot;&gt;&lt;a class=\&quot;tt-button tt-button--fill\&quot; href=\&quot;https://example.com\&quot;&gt;Get started&lt;/a&gt;&lt;/div&gt;&lt;p&gt;&lt;/p&gt;&quot;"></div>
<textarea id="content" name="content" style="display:none"></textarea>
</div>
<script src="build/demo.js"></script>
</body>
</html>
